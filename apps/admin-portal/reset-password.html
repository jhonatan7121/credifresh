<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Restablecer contraseña · CrediFresh</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0d1b4c;background:#f5f7fa;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,460px);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:32px;box-shadow:0 12px 40px #0d1b4c12}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;font-weight:800;font-size:20px}.mark{width:44px;height:44px;border-radius:14px;background:#e9f7ef;color:#0d1b4c;display:grid;place-items:center}
    h1{font-size:27px;line-height:1.2;margin:0 0 10px}p{color:#687280;line-height:1.55;margin:0 0 24px}label{display:block;font-weight:650;margin:18px 0 8px}
    input{width:100%;padding:14px 15px;border:1px solid #d8e0e8;border-radius:12px;font:inherit;color:inherit}input:focus{outline:3px solid #174bff30;border-color:#174bff}
    button{width:100%;border:0;border-radius:12px;background:#174bff;color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:15px;margin-top:24px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
    #message{margin:18px 0 0;padding:12px;border-radius:10px;display:none}#message.error{display:block;background:#fff0f0;color:#a32935}#message.success{display:block;background:#e9f7ef;color:#176443}
    .hint{font-size:13px;margin:18px 0 0}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">CF</span><span>CrediFresh</span></div>
    <h1>Restablece tu contraseña</h1>
    <p>Elige una contraseña nueva para tu cuenta. El enlace solo se puede usar una vez.</p>
    <form id="reset-form" novalidate>
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
      <label for="confirm-password">Confirma la contraseña</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
      <button id="submit-button" type="submit">Guardar contraseña</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="hint">Si el enlace venció o ya se utilizó, solicita uno nuevo desde la pantalla de inicio de sesión.</p>
  </main>
  <script src="/config.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (token) history.replaceState(null, "", window.location.pathname);
      const form = document.getElementById("reset-form");
      const button = document.getElementById("submit-button");
      const message = document.getElementById("message");
      const apiBase = (window.CREDIFRESH_CONFIG?.apiBase || `${window.location.protocol}//${window.location.hostname}:8000`).replace(/\/+$/, "");
      const showMessage = (text, kind) => {
        message.textContent = text;
        message.className = kind;
      };
      if (!token) {
        form.hidden = true;
        showMessage("El enlace no contiene un token válido. Solicita un enlace nuevo.", "error");
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("confirm-password").value;
        if (password.length < 8) return showMessage("La contraseña debe tener al menos 8 caracteres.", "error");
        if (password !== confirmation) return showMessage("Las contraseñas no coinciden.", "error");
        button.disabled = true;
        button.textContent = "Guardando…";
        try {
          const response = await fetch(`${apiBase}/auth/password-reset/confirm`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password }),
            referrerPolicy: "no-referrer",
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.detail || "No se pudo restablecer la contraseña.");
          form.hidden = true;
          showMessage("Contraseña actualizada. Ya puedes iniciar sesión en CrediFresh.", "success");
        } catch (error) {
          showMessage(error.message || "No pudimos conectar con CrediFresh. Comprueba que el servidor esté activo.", "error");
          button.disabled = false;
          button.textContent = "Guardar contraseña";
        }
      });
    })();
  </script>
</body>
</html>
