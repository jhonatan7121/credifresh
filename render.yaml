# Temporary free-tier deployment for testing only. Do not use real client data.
# The API can sleep when idle, and the free Postgres database expires after 30 days.
services:
  - type: web
    name: credifresh-api-demo
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./apps/backend-api/Dockerfile
    dockerContext: ./apps/backend-api
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credifresh-db-demo
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RESET_PASSWORD_URL
        value: https://credifresh-portal-demo.onrender.com/reset-password.html
      - key: ALLOWED_ORIGINS
        value: https://credifresh-portal-demo.onrender.com
      - key: BANK_OPERATIONS_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: production

  - type: web
    name: credifresh-portal-demo
    runtime: static
    rootDir: apps/admin-portal
    buildCommand: sh render-build.sh
    staticPublishPath: .
    autoDeployTrigger: off
    envVars:
      - key: API_BASE_URL
        value: https://credifresh-api-demo.onrender.com

databases:
  - name: credifresh-db-demo
    databaseName: credifresh_demo
    user: credifresh_user
    region: virginia
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
