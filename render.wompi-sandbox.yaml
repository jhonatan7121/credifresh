# Isolated Wompi collection and payout test sandbox. Never connect production data here.
services:
  - type: web
    name: credifresh-wompi-sandbox
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./apps/backend-api/Dockerfile
    dockerContext: ./apps/backend-api
    dockerCommand: sh scripts/start_wompi_sandbox.sh
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credifresh-wompi-sandbox-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: sandbox
      - key: CREDIFRESH_SANDBOX_RELEASE
        value: credit-payout-v2
      - key: WOMPI_ENVIRONMENT
        value: sandbox
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_PAYOUT_ENVIRONMENT
        value: sandbox
      - key: WOMPI_PAYOUT_API_KEY
        sync: false
      - key: WOMPI_PAYOUT_USER_PRINCIPAL_ID
        sync: false
      - key: WOMPI_PAYOUT_EVENTS_SECRET
        sync: false
      - key: WOMPI_SANDBOX_SEED_DATA
        value: "true"
      - key: WOMPI_SANDBOX_TEST_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: BANK_OPERATIONS_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://credifresh-wompi-sandbox-portal.onrender.com

  - type: web
    name: credifresh-wompi-sandbox-portal
    runtime: static
    rootDir: apps/admin-portal
    buildCommand: sh render-build.sh
    staticPublishPath: .
    autoDeployTrigger: off
    envVars:
      - key: API_BASE_URL
        value: https://credifresh-wompi-sandbox.onrender.com
      - key: CREDIFRESH_SANDBOX_RELEASE
        value: credit-payout-v2

databases:
  - name: credifresh-wompi-sandbox-db
    databaseName: credifresh_wompi_sandbox
    user: credifresh_sandbox
    region: virginia
    plan: 0.1c-256mb
    ipAllowList: []
